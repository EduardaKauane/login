<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Página de Login">
    <title>Entrar · Sistema</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
            background-color: #f0f2f5;
        }

        .form-signin {
            width: 100%;
            max-width: 330px;
            padding: 15px;
            margin: auto;
        }

        .form-signin .form-floating:focus-within {
            z-index: 2;
        }

        .form-signin input[type="email"] {
            margin-bottom: -1px;
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }

        .form-signin input[type="password"] {
            margin-bottom: 10px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }

        .faq-icon {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, background-color 0.3s ease;
            z-index: 1000;
        }

        .faq-icon:hover {
            transform: scale(1.1);
            background-color: #0056b3;
            color: white;
        }
    </style>
</head>
<body class="text-center">

    <main class="form-signin">
        <form>
            <img class="mb-4" src="perfil.png" alt="Logo" width="72" height="57">
            <h1 class="h3 mb-3 fw-normal">Por favor, entre!</h1>

            <div class="form-floating">
                <input type="email" class="form-control" id="loginEmail" placeholder="nome@exemplo.com">
                <label for="floatingInput">Endereço de e-mail</label>
            </div>
            
            <div class="form-floating">
                <input type="password" class="form-control" id="loginSenha" placeholder="Senha">
                <label for="floatingPassword">Senha</label>
            </div>

            <div class="checkbox mb-3 text-start">
                <label>
                    <input type="checkbox" value="remember-me"> Lembre-se
                </label>
            </div>

            <button class="w-100 btn btn-lg btn-primary" type="button" onclick="acessar()">Entrar</button>
            <p class="mt-5 mb-3 text-muted">&copy; 2026</p>
        </form>
    </main>

    <a href="faq.html" class="faq-icon" title="Dúvidas Frequentes">?</a>

    <script src="main.js"></script>
</body>
</html>
